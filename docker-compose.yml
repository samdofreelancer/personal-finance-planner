services:
  db:
    image: postgres:16-alpine
    container_name: finance-planner-db
    environment:
      POSTGRES_DB: personal_finance_planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
    ports:
      - "5432:5432"
    volumes:
      - finance_planner_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d personal_finance_planner"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - finance-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-planner-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/personal_finance_planner
      SPRING_DATASOURCE_USERNAME: planner
      SPRING_DATASOURCE_PASSWORD: planner
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - finance-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finance-planner-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - finance-network
    restart: unless-stopped

volumes:
  finance_planner_db_data:

networks:
  finance-network:
    driver: bridge