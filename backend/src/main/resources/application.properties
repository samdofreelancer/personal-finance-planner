# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL Datasource (via environment variables in Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/personal_finance_planner}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:planner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Existing installations are baselined at V1; V2 adds the loan schedule without touching assumptions.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-float-as-int=false

# CORS allowed origins (Docker + local dev)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://frontend

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.timeout=30m

# Persist authenticated sessions in Redis. Redis AOF + its named Compose volume
# keep sessions across backend and Redis container restarts.
spring.session.store-type=redis
spring.session.redis.namespace=planwise:session
spring.session.redis.flush-mode=on-save
spring.session.timeout=30m
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false

# Password recovery email delivery is deliberately disabled until SMTP credentials
# and the trusted public URL are configured in the deployment environment.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.host=${APP_MAIL_HOST:}
app.mail.port=${APP_MAIL_PORT:587}
app.mail.username=${APP_MAIL_USERNAME:}
app.mail.password=${APP_MAIL_PASSWORD:}
app.mail.from=${APP_MAIL_FROM:}
app.mail.starttls=${APP_MAIL_STARTTLS:true}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost}

# Expose health only. Readiness includes dependencies; liveness stays process-local
# so a transient database/Redis outage does not cause restart loops.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.health.group.liveness.include=livenessState
management.health.redis.enabled=true

spring.jpa.open-in-view=false
