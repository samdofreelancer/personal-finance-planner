name: finance-planner-sonar

services:
  sonar-db:
    image: postgres:17-alpine
    container_name: finance-planner-sonar-db
    environment:
      POSTGRES_DB: ${SONAR_DB_NAME:-sonar}
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD in .env}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sonar-network
    restart: unless-stopped

  sonarqube:
    image: sonarqube:26.11.0.134175-community
    container_name: finance-planner-sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/${SONAR_DB_NAME:-sonar}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
      - sonar_temp:/opt/sonarqube/temp
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc:
        soft: 8192
        hard: 8192
    networks:
      - sonar-network
    restart: unless-stopped

volumes:
  sonar_db_data:
    name: finance-planner-sonar-db-data
  sonar_data:
    name: finance-planner-sonar-data
  sonar_extensions:
    name: finance-planner-sonar-extensions
  sonar_logs:
    name: finance-planner-sonar-logs
  sonar_temp:
    name: finance-planner-sonar-temp

networks:
  sonar-network:
    name: finance-sonar-network
    driver: bridge
